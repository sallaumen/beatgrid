services:
  db:
    image: postgres:16-alpine
    # The library lives here and this is a desktop machine: bring the database
    # back with Docker Desktop instead of making every session start with a
    # manual `compose up`. "unless-stopped" still honours a deliberate stop.
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beatgrid_dev
    # Defaults to 5434. A machine-local override keeps other databases running.
    ports:
      - "127.0.0.1:${BEATGRID_DB_PORT:-5434}:5432"
    volumes:
      - beatgrid_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  beatgrid_pg:
